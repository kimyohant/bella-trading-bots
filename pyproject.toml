[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bottrade"
version = "0.1.0"
description = "Paper-trading bot for Polymarket and pump.fun with a pluggable multi-agent pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
fast = ["httpx>=0.27"]

[project.scripts]
bottrade = "bottrade.cli:main"

[tool.setuptools]
packages = ["bottrade", "bottrade.agents", "bottrade.data", "bottrade.venues", "bottrade.web"]

[tool.setuptools.package-data]
bottrade = ["web/ui.html"]
